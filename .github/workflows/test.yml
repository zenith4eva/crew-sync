name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r requirements.txt
      - run: cd backend/meta && npm ci
      - run: cd frontend && npm ci && npm run build
      # Unit tests plus the end-to-end run on a synthetic clip; no Meta API key needed.
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t crew-sync .
      # The image must start and answer its health check without an API key.
      - run: |
          docker run -d --name app -p 8000:8000 crew-sync
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
          docker logs app
