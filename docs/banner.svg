<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Crew Sync: every dancer, in sync">
  <rect width="1280" height="400" rx="24" fill="#000"/>
  <!-- The mark: four dancers in a line, one a step off the beat. -->
  <g transform="translate(96 118) scale(4.2)">
    <circle cx="3" cy="11" r="2.5" fill="#fff"/>
    <circle cx="8.5" cy="11" r="2.5" fill="#fff"/>
    <circle cx="14" cy="6" r="2.5" fill="#c6f24e"/>
    <circle cx="19.5" cy="11" r="2.5" fill="#fff"/>
  </g>
  <text x="96" y="262" fill="#fff" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" letter-spacing="-4">Crew Sync</text>
  <g fill="#b4b4b4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="30">
    <text x="100" y="314">Who is out of step, where the formation</text>
    <text x="100" y="354">breaks, and one score to share.</text>
  </g>
  <!-- Four lanes of the sync strip: a tick per beat, lime in sync, white off, red bands flagged. -->
  <g transform="translate(760 70)">
    <g fill="#c6f24e">
      <rect x="0" y="27" width="5" height="6" rx="1"/><rect x="40" y="27" width="5" height="6" rx="1"/><rect x="80" y="27" width="5" height="6" rx="1"/><rect x="120" y="27" width="5" height="6" rx="1"/><rect x="160" y="27" width="5" height="6" rx="1"/><rect x="200" y="27" width="5" height="6" rx="1"/><rect x="240" y="27" width="5" height="6" rx="1"/><rect x="280" y="27" width="5" height="6" rx="1"/><rect x="320" y="27" width="5" height="6" rx="1"/><rect x="360" y="27" width="5" height="6" rx="1"/><rect x="400" y="27" width="5" height="6" rx="1"/>
      <rect x="0" y="87" width="5" height="6" rx="1"/><rect x="40" y="87" width="5" height="6" rx="1"/><rect x="80" y="87" width="5" height="6" rx="1"/><rect x="240" y="87" width="5" height="6" rx="1"/><rect x="280" y="87" width="5" height="6" rx="1"/><rect x="320" y="87" width="5" height="6" rx="1"/><rect x="360" y="87" width="5" height="6" rx="1"/><rect x="400" y="87" width="5" height="6" rx="1"/>
      <rect x="0" y="147" width="5" height="6" rx="1"/><rect x="40" y="147" width="5" height="6" rx="1"/><rect x="80" y="147" width="5" height="6" rx="1"/><rect x="120" y="147" width="5" height="6" rx="1"/><rect x="160" y="147" width="5" height="6" rx="1"/><rect x="200" y="147" width="5" height="6" rx="1"/><rect x="240" y="147" width="5" height="6" rx="1"/><rect x="280" y="147" width="5" height="6" rx="1"/><rect x="400" y="147" width="5" height="6" rx="1"/>
      <rect x="0" y="207" width="5" height="6" rx="1"/><rect x="40" y="207" width="5" height="6" rx="1"/><rect x="80" y="207" width="5" height="6" rx="1"/><rect x="120" y="207" width="5" height="6" rx="1"/><rect x="160" y="207" width="5" height="6" rx="1"/><rect x="200" y="207" width="5" height="6" rx="1"/><rect x="240" y="207" width="5" height="6" rx="1"/><rect x="280" y="207" width="5" height="6" rx="1"/><rect x="320" y="207" width="5" height="6" rx="1"/><rect x="360" y="207" width="5" height="6" rx="1"/><rect x="400" y="207" width="5" height="6" rx="1"/>
    </g>
    <g stroke="#262626" stroke-width="2"><line x1="0" x2="410" y1="30" y2="30"/><line x1="0" x2="410" y1="90" y2="90"/><line x1="0" x2="410" y1="150" y2="150"/><line x1="0" x2="410" y1="210" y2="210"/></g>
    <rect x="108" y="70" width="114" height="40" rx="8" fill="#e5484d" fill-opacity="0.16" stroke="#5a2a33"/>
    <rect x="308" y="130" width="74" height="40" rx="8" fill="#e5484d" fill-opacity="0.16" stroke="#5a2a33"/>
    <g fill="#fff"><rect x="120" y="90" width="5" height="16" rx="1"/><rect x="160" y="90" width="5" height="18" rx="1"/><rect x="200" y="90" width="5" height="14" rx="1"/><rect x="320" y="134" width="5" height="16" rx="1"/><rect x="360" y="136" width="5" height="14" rx="1"/></g>
    <g fill="#b4b4b4" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="end">
      <circle cx="-82" cy="30" r="6" fill="#ff5d5d"/><text x="-16" y="36">Mina</text>
      <circle cx="-82" cy="90" r="6" fill="#3ddc84"/><text x="-16" y="96">Jia</text>
      <circle cx="-82" cy="150" r="6" fill="#4c8dff"/><text x="-16" y="156">Yuna</text>
      <circle cx="-82" cy="210" r="6" fill="#ffc53d"/><text x="-16" y="216">Sora</text>
    </g>
    <text x="0" y="268" fill="#949494" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Every beat, every dancer, against the rest of the crew</text>
  </g>
</svg>
